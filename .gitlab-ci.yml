include: "https://gitlab.cern.ch/apc/susofts/shared/sus_ci_cppworker/raw/master/.gitlab-ci-TEMPLATE.yml"

##################
# LINUX BUILDS   #
##################

# Build all targets and run the tests
linux_build_and_test:
    script:
        - echo "Building all targets | -j$(nproc)"
        - $CMAKEBIN --build . -j $(nproc) --config Release
        - echo "Running the tests"
        - ./staging/UnitTests

# Build and upload the libSpatialObjDLL.so
linux_release:
    script:
        - echo "Building shared object library | -j$(nproc)"
        - $CMAKEBIN --build . -j $(nproc) --config Release --target SpatialObjDLL
        - cp staging/libSpatialObjDLL.so ..
    artifacts:
        name: sharedlibrary
        paths:
            - libSpatialObjDLL.so

##################
# WINDOWS BUILDS #
##################

# Build all targets and run the tests
windows64_build_and_test:
    script:
        - echo "Building all targets"
        - cmake --build . -j %NUMBER_OF_PROCESSORS% --config Release
        - echo "Running the tests"
        - staging\UnitTests.exe

# Build and upload the SpatialObjDLL.dll
windows64_release:
    script:
        - echo "Building shared object library"
        - cmake --build . -j %NUMBER_OF_PROCESSORS% --config Release --target SpatialObjDLL
        - cp staging/SpatialObjDLL.dll ..
    artifacts:
        name: win64dll
        paths:
            - SpatialObjDLL.dll

# Build all targets and run the tests
windows32_build_and_test:
    extends: windows64_build_and_test
    tags:
        - windows
        - x32
    variables:
        CMAKEGENERATOR: "Visual Studio 15 2017"

# Build and upload the SpatialObjDLL.dll
windows32_release:
    extends: windows64_release
    tags:
        - windows
        - x32
    variables:
        CMAKEGENERATOR: "Visual Studio 15 2017"
    artifacts:
        name: win32dll
